[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theriad"
version = "0.1.0"
description = "Cost-optimized AI inference — route prompts to the cheapest model that can handle them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "langdetect>=1.0.9",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "headroom-ai>=0.22.4",
]

[project.urls]
Homepage = "https://github.com/Piranha315/Cost-Optimization"
Repository = "https://github.com/Piranha315/Cost-Optimization"

[project.optional-dependencies]
gateway-onnx = ["onnxruntime>=1.19", "tokenizers>=0.20"]
gateway-gcp = [
    "google-auth>=2.35",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
]
# Semantic embedding routing (layer 2) — downloads a ~90 MB model on first use
embeddings = [
    "sentence-transformers>=3.0",
]
# Offline prompt-difficulty representation training. Dataset JSONL is streamed
# directly from pinned Hub revisions, so the heavyweight `datasets`/`pyarrow`
# stack is intentionally unnecessary.
training = [
    "sentence-transformers>=3.0",
    "safetensors>=0.4",
    "Pillow>=10.0",
    "scikit-learn>=1.5",
]
# OpenSandbox browser runtime. Playwright is only the CDP client; OpenSandbox
# owns the isolated Chromium lifecycle; no local Chromium process is launched.
browser = [
    "opensandbox>=0.1.16,<0.2",
    "playwright>=1.45",
]
scrapling = [
    "scrapling[fetchers]>=0.3",
]
captcha-solver = [
    "scrapling[fetchers]>=0.3",
    "capsolver>=1.0",
]
desktop = [
    "pyobjc-framework-Quartz>=10.0; platform_system == 'Darwin'",
    "pyobjc-framework-Cocoa>=10.0; platform_system == 'Darwin'",
]
# Everything except desktop
all = [
    "sentence-transformers>=3.0",
    "safetensors>=0.4",
    "Pillow>=10.0",
    "scikit-learn>=1.5",
    "opensandbox>=0.1.16,<0.2",
    "playwright>=1.45",
    "scrapling[fetchers]>=0.3",
    "capsolver>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "Pillow>=10.0",
    "scikit-learn>=1.5",
]

[project.scripts]
theriad = "theriad.cli.main:cli"
theriad-gateway = "theriad.gateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["theriad*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
